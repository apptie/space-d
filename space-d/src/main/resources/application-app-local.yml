log:
  directory: ./

token:
  access-key: 
  refresh-key: 
  issuer: localissuer
  access-expired-seconds: 3600
  refresh-expired-seconds: 259200
  access-expired-millis-seconds: 3600000
  refresh-expired-millis-seconds: 259200000

app:
  profile:
    nickname:
      adjective:
        - 멋있는
        - 무서운
        - 상큼한
        - 행복한
        - 재빠른
      planet:
        - 수성
        - 금성
        - 지구
        - 화성
        - 목성
        - 토성
        - 천왕성
        - 해왕성
      format: "%s%03d"
  quiz:
    question: "다음 예문을 보고 예문에 맞는 용어를 선택해주세요."
  image:
    path: /home/

auth:
  secret-key: secret_key
  salt: salt
